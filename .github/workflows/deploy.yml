name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # Load Node/NVM environment for non-interactive shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/ | tail -1)/bin:$PATH"

            # 1. Force IPv4 for git to resolve broken IPv6 VPS routing timeouts
            git config --global http.ipresolve v4

            # 2. Navigate to project root & Pull Latest Code
            cd /var/www/Thalapathi/Flazly
            git config --global --add safe.directory /var/www/Thalapathi/Flazly
            
            # Print diagnostic info before pull
            echo "--- Checking Github Connectivity ---"
            curl -I -m 5 https://github.com || echo "GitHub Connection timed out over HTTPS. Trying IPv4 fallback..."
            
            git fetch --all
            git reset --hard origin/main || {
              echo "Error: git pull/reset failed. Checking DNS/Network settings..."
              getent ahosts github.com
              exit 1
            }

            # Ensure proper execution permissions for local .bin tools
            chmod -R +w /var/www/Thalapathi/Flazly/backend 2>/dev/null || true

            # 3. Build Frontend
            echo "--- Building Frontend ---"
            cd /var/www/Thalapathi/Flazly/frontend
            npm install
            node node_modules/typescript/bin/tsc -b && node node_modules/vite/bin/vite.js build

            # 4. Build Backend
            echo "--- Building Backend ---"
            cd /var/www/Thalapathi/Flazly/backend
            npm install
            npm run build

            # 5. Restart Backend Service via PM2
            # Assumes you started it initially with: pm2 start dist/main.js --name flazly-backend
            pm2 restart flazly-backend || pm2 start dist/main.js --name flazly-backend
            pm2 save
            
            echo "Deployment Completed Successfully!"
