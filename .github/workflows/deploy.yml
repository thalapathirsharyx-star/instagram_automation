name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # 1. Navigate to project root & Pull Latest Code
            cd /var/www/Thalapathi/Replyzens
            git config --global --add safe.directory /var/www/Thalapathi/Replyzens
            git pull origin main

            # 2. Build Frontend
            echo "--- Building Frontend ---"
            cd /var/www/Thalapathi/Replyzens/frontend
            npm install
            node node_modules/typescript/bin/tsc -b && node node_modules/vite/bin/vite.js build

            # 3. Build Backend
            echo "--- Building Backend ---"
            cd /var/www/Thalapathi/Replyzens/backend
            npm install
            npm run build

            # 4. Restart Backend Service via PM2
            # Assumes you started it initially with: pm2 start dist/main.js --name replyzens-backend
            pm2 restart replyzens-backend || pm2 start dist/main.js --name replyzens-backend
            pm2 save
            
            echo "Deployment Completed Successfully!"
