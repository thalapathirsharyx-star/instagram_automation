<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Dark theme.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Flazly - AI-Powered Instagram Sales Agent & CRM</title>
    <meta name="title" content="Flazly - AI-Powered Instagram Sales Agent & CRM" />
    <meta name="description" content="Turn Instagram DMs and comments into paying customers on autopilot. Flazly AI responds instantly, qualifies buyers, and syncs leads directly to your CRM." />
    <meta name="keywords" content="Instagram automation, AI sales agent, Instagram CRM, DM automation, comment to DM, social selling, lead qualification, Flazly" />
    <meta name="author" content="Flazly" />
    <meta name="theme-color" content="#09090b" />
    <link rel="canonical" href="https://flazly.com" />

    <!-- Inter: the one typeface for the whole product. Loaded here rather than with a
         CSS @import so the request starts before the stylesheet has been parsed. Only the
         weights the type scale uses are requested (400 text, 500 emphasis, 600 headings,
         700 where unavoidable). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flazly.com" />
    <meta property="og:title" content="Flazly - AI-Powered Instagram Sales Agent & CRM" />
    <meta property="og:description" content="Turn Instagram DMs and comments into paying customers on autopilot. Flazly AI responds instantly, qualifies buyers, and syncs leads directly to your CRM." />
    <meta property="og:image" content="https://flazly.com/Dark%20theme.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://flazly.com" />
    <meta property="twitter:title" content="Flazly - AI-Powered Instagram Sales Agent & CRM" />
    <meta property="twitter:description" content="Turn Instagram DMs and comments into paying customers on autopilot. Flazly AI responds instantly, qualifies buyers, and syncs leads directly to your CRM." />
    <meta property="twitter:image" content="https://flazly.com/Dark%20theme.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Flazly",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "AI-powered Instagram sales automation and CRM platform that transforms DMs and comments into automated sales funnels."
      }
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
